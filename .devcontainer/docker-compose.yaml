name: dev-code-js

services:
  app:
    build:
      context: .
      dockerfile: dockerfile
      args:
        USERNAME: 'vscode'
        GIT_SIGNING_PUB_KEY: '${GIT_SIGNING_PUB_KEY:-}'
        GIT_USER_NAME: '${GIT_USER_NAME:-}'
        GIT_USER_EMAIL: '${GIT_USER_EMAIL:-}'
        NVM_VERSION: 'v0.39.7'
        DEFAULT_NODE_VERSION: '24'
        NODE_VERSIONS: '18 20 22 24 26'
    command: sleep infinity
    volumes:
      - type: bind
        source: ..
        target: /workspaces/dev-code-js
        consistency: cached
      - type: bind
        source: ${AI_CONFIG_HOST}
        target: ${AI_CONFIG_TARGET}
        consistency: cached
