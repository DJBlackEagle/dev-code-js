# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      timezone: 'Europe/Berlin'
      interval: 'weekly'
    assignees:
      - 'DJBlackEagle'
    commit-message:
      prefix: 'chore(deps)'
    open-pull-requests-limit: 10
    groups:
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'angular-eslint'
        update-types:
          - 'minor'
          - 'patch'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
        update-types:
          - 'minor'
          - 'patch'
      commitlint:
        patterns:
          - '@commitlint/*'
        update-types:
          - 'minor'
          - 'patch'
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependabot'
      - 'dependencies'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      timezone: 'Europe/Berlin'
      interval: 'monthly'
    assignees:
      - 'DJBlackEagle'
    commit-message:
      prefix: 'ci(deps)'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    labels:
      - 'dependabot'
      - 'github-actions'
