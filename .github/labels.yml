# ============================================================================
# 1. Change Type (Aligned with Conventional Commits & Release Notes)
# ============================================================================
- name: 'breaking-change'
  color: b60205
  description: 'Introduces an API change that breaks backward compatibility.'
- name: 'security'
  color: d73a4a
  description: 'Addresses a vulnerability or security risk in this project.'
- name: 'bug'
  color: d73a4a
  description: 'Something is not working as expected.'
- name: 'feature'
  color: 0e8a16
  description: 'Introduces a new feature or configuration preset.'
- name: 'enhancement'
  color: 1d76db
  description: 'Improves existing functionality without adding a major new feature.'
- name: 'documentation'
  color: 0052cc
  description: 'Improvements or additions to documentation.'
- name: 'refactor'
  color: 1d76db
  description: 'Code restructuring without changing external behavior.'
- name: 'performance'
  color: 1d76db
  description: 'Improves build, lint, or runtime performance.'
- name: 'test'
  color: 1d76db
  description: 'Adds or updates unit or integration tests.'
- name: 'ci'
  color: 1d76db
  description: 'Changes to GitHub Actions workflows or CI pipelines.'
- name: 'dependencies'
  color: 0366d6
  description: 'Updates to project dependencies.'
- name: 'maintenance'
  color: 799ab0
  description: 'General repository maintenance and chore tasks.'
- name: 'revert'
  color: fbca04
  description: 'Reverts a previous commit or pull request.'
- name: 'release'
  color: 0e8a16
  description: 'Marks a package release pull request or issue.'

# ============================================================================
# 2. Module Scopes
# ============================================================================
- name: 'scope: tsconfig'
  color: 5319e7
  description: 'Related to TypeScript configuration presets.'
- name: 'scope: eslint'
  color: 5319e7
  description: 'Related to ESLint Flat Config presets.'
- name: 'scope: prettier'
  color: 5319e7
  description: 'Related to Prettier formatting presets.'
- name: 'scope: vitest'
  color: 5319e7
  description: 'Related to Vitest test runner presets.'
- name: 'scope: markdownlint'
  color: 5319e7
  description: 'Related to Markdownlint presets.'
- name: 'scope: git-tooling'
  color: 5319e7
  description: 'Related to Commitlint and Lint-Staged presets.'
- name: 'scope: devcontainer'
  color: 5319e7
  description: 'Related to DevContainer templates.'

# ============================================================================
# 3. Priority
# ============================================================================
- name: 'priority: critical'
  color: b60205
  description: 'Must be addressed immediately.'
- name: 'priority: high'
  color: d93f0b
  description: 'High priority; should be addressed next.'
- name: 'priority: medium'
  color: fbca04
  description: 'Normal priority.'
- name: 'priority: low'
  color: c2e0c6
  description: 'Low priority or nice-to-have improvement.'

# ============================================================================
# 4. Status & Triage
# ============================================================================
- name: 'needs-triage'
  color: fbca04
  description: 'Needs initial review and categorization by maintainers.'
- name: 'in-progress'
  color: fbca04
  description: 'Currently being worked on.'
- name: 'blocked'
  color: d93f0b
  description: 'Blocked by an external dependency or another issue.'
- name: 'stale'
  color: ededed
  description: 'No activity for an extended period.'
- name: 'no-stale'
  color: cfd3d7
  description: 'Exempt from automatic closing by the stale bot.'
- name: 'incomplete'
  color: cfd3d7
  description: 'Missing required information or reproduction steps.'
- name: 'invalid'
  color: cfd3d7
  description: 'Off-topic, spam, or not applicable to this project.'
- name: 'duplicate'
  color: cfd3d7
  description: 'This issue or pull request already exists.'
- name: 'wontfix'
  color: cfd3d7
  description: 'This will not be worked on.'

# ============================================================================
# 5. Community & Automation
# ============================================================================
- name: 'good-first-issue'
  color: 7057ff
  description: 'Good for newcomers wanting to contribute.'
- name: 'help-wanted'
  color: 008672
  description: 'Extra attention or community help is welcome.'
- name: 'dependabot'
  color: 8a91ad
  description: 'Created automatically by Dependabot.'
- name: 'github-actions'
  color: 8a91ad
  description: 'Related to GitHub Actions updates.'
