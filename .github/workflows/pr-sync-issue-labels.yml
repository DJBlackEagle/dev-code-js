name: 'Sync Issue Labels to PR'

on:
  issues:
    types:
      - closed
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  sync-labels:
    name: Sync issue and PR labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync issue and PR labels
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const statusLabelsToRemove = ['in-progress', 'in-review'];

            const removeStatusLabels = async (issueNumber, existingLabelNames) => {
              for (const labelName of statusLabelsToRemove) {
                if (!existingLabelNames.has(labelName)) {
                  continue;
                }

                try {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name: labelName,
                  });
                  core.info(`Removed "${labelName}" label from issue #${issueNumber}.`);
                } catch (error) {
                  if (error.status !== 404) {
                    throw error;
                  }
                }
              }
            };

            if (context.eventName === 'issues') {
              const issue = context.payload.issue;
              const existingLabelNames = new Set(issue.labels.map((label) => label.name));
              await removeStatusLabels(issue.number, existingLabelNames);
              return;
            }

            const ignoredLabels = new Set([
              'needs-triage',
              'in-progress',
              'in-review',
              'blocked',
              'stale',
              'no-stale',
              'incomplete',
              'invalid',
              'duplicate',
              'wontfix',
            ]);

            const prNumber = context.payload.pull_request.number;

            const result = await github.graphql(
              `
                query ($owner: String!, $repo: String!, $prNumber: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $prNumber) {
                      closingIssuesReferences(first: 20) {
                        nodes {
                          number
                          state
                          labels(first: 50) {
                            nodes {
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `,
              { owner, repo, prNumber },
            );

            const linkedIssues = result.repository.pullRequest.closingIssuesReferences.nodes;
            if (linkedIssues.length === 0) {
              core.info('No linked closing issues found.');
              return;
            }

            if (context.payload.action === 'closed') {
              for (const issue of linkedIssues) {
                const existingLabelNames = new Set(issue.labels.nodes.map((label) => label.name));
                await removeStatusLabels(issue.number, existingLabelNames);
              }
              return;
            }

            const labelsToAdd = [
              ...new Set(
                linkedIssues
                  .flatMap((issue) => issue.labels.nodes.map((label) => label.name))
                  .filter((name) => !ignoredLabels.has(name)),
              ),
            ];

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: prNumber,
                labels: labelsToAdd,
              });
              core.info(`Synced labels to PR #${prNumber}: ${labelsToAdd.join(', ')}`);
            } else {
              core.info('No eligible labels to sync from linked issues.');
            }

            for (const issue of linkedIssues) {
              if (issue.state !== 'OPEN') {
                continue;
              }

              const existingLabelNames = new Set(issue.labels.nodes.map((label) => label.name));
              if (existingLabelNames.has('in-review')) {
                continue;
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: ['in-review'],
              });
              core.info(`Added "in-review" label to issue #${issue.number}.`);
            }
