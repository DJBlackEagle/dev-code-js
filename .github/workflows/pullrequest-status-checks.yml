name: 'Code quality and tests'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cqat_detect_changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.filter.outputs.code_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Determine change scope 🔍
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE '^(src/|tests/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig.*\.json$|eslint\.config\.js$|vitest\.config\.ts$|\.github/workflows/pullrequest-status-checks\.yml$)'; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

  cqat_validate_commits:
    name: Validate commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pnpm 📦
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies 🔧
        run: pnpm install --frozen-lockfile
      - name: Validate pull request commits 📝
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  cqat_check_sourcecode:
    name: Check source code & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - cqat_detect_changes
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm 📦
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies 🔧
        run: pnpm install --frozen-lockfile
      - name: Run Prettier 📃
        run: pnpm run format
      - name: Run ESLint & Markdownlint 📝
        run: pnpm run lint
      - name: Run TypeScript Typecheck 🔍
        if: needs.cqat_detect_changes.outputs.code_changed == 'true'
        run: pnpm run typecheck
      - name: Run Production Build 🏗️
        if: needs.cqat_detect_changes.outputs.code_changed == 'true'
        run: pnpm run build

  cqat_test_units:
    name: Unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - cqat_detect_changes
    if: needs.cqat_detect_changes.outputs.code_changed == 'true'
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm 📦
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies 🔧
        run: pnpm install --frozen-lockfile
      - name: Run Vitest 🧪
        run: pnpm run test

  cqat_status_gate:
    name: All status checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - cqat_detect_changes
      - cqat_validate_commits
      - cqat_check_sourcecode
      - cqat_test_units
    steps:
      - name: Verify upstream job results ✅
        run: |
          RESULTS=(
            "${{ needs.cqat_detect_changes.result }}"
            "${{ needs.cqat_validate_commits.result }}"
            "${{ needs.cqat_check_sourcecode.result }}"
            "${{ needs.cqat_test_units.result }}"
          )

          for RESULT in "${RESULTS[@]}"; do
            if [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; then
              echo "Upstream job failed or was cancelled (status: $RESULT)"
              exit 1
            fi
          done

          echo "All required status checks succeeded!"
